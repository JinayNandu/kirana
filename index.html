<!doctype html>
<!--
  Repository root, not the app.

  GitHub Pages serves a repo from its root, and this app lives in
  app/ because tools/ and parked/ are not things to publish. So the
  short URL lands here and goes on.

  The redirect is a <meta refresh> rather than JavaScript, so it still
  works with scripts off, and the link underneath is there for the
  case where even that is ignored. Relative paths throughout: this has
  to work at example.github.io/kirana/ as well as at a bare domain.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=./app/">
<link rel="canonical" href="./app/">
<title>Milan's Super Shoppe</title>
<style>
  :root{ --paper:#FAF7F0; --ink:#1C1A17; --leaf:#1F5C3D; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#14120F; --ink:#F2EEE6; --leaf:#7FBF9A; }
  }
  :root[data-theme="dark"]{ --paper:#14120F; --ink:#F2EEE6; --leaf:#7FBF9A; }
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center; text-align:center;
    background:var(--paper); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:16px;
  }
  a{color:var(--leaf); font-weight:600}
</style>
</head>
<body>
  <p>Taking you to <a href="./app/">Milan&rsquo;s Super Shoppe</a>&hellip;</p>
</body>
</html>
